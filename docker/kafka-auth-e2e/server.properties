# KRaft cluster configuration
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093

# Listeners matching Charmed Kafka conventions:
# PLAINTEXT on 9092 for internal/admin ops, CLIENT on 9096 with SASL_SSL
listeners=PLAINTEXT://:9092,CONTROLLER://:9093,CLIENT://:9096
advertised.listeners=PLAINTEXT://localhost:9092,CLIENT://localhost:9096
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,CLIENT:SASL_SSL
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT

# TLS configuration (PKCS12 format)
ssl.keystore.location=/mnt/certs/server.keystore.p12
ssl.keystore.password=changeit
ssl.keystore.type=PKCS12
ssl.truststore.location=/mnt/certs/server.truststore.p12
ssl.truststore.password=changeit
ssl.truststore.type=PKCS12

# SASL OAUTHBEARER configuration with native KIP-768 validator callback
sasl.enabled.mechanisms=OAUTHBEARER
listener.name.client.sasl.enabled.mechanisms=OAUTHBEARER
listener.name.client.oauthbearer.sasl.server.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler
listener.name.client.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;
listener.name.client.sasl.oauthbearer.jwks.endpoint.url=http://hydra:4444/.well-known/jwks.json
listener.name.client.sasl.oauthbearer.expected.audience=kafka
listener.name.client.sasl.oauthbearer.expected.issuer=http://hydra:4444/
listener.name.client.sasl.oauthbearer.sub.claim.name=client_id

# StandardAuthorizer with strict zero-trust default
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
super.users=User:admin;User:ANONYMOUS
allow.everyone.if.no.acl.found=false

log.dirs=/tmp/kraft-combined-logs
