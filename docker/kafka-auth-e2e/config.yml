kafka:
  clusters:
    - name: kafka-auth-e2e
      bootstrapServers: localhost:9092
      serde:
        - name: ProtobufFile
          properties:
            protobufFilesDir: /etc/protos
            protobufMessageName: authorization.service.api.v1.PermissionUpdateEnvelope
            protobufMessageNameByTopic:
              permissions.hook-service: authorization.service.api.v1.PermissionUpdateEnvelope
          topicValuesPattern: "permissions\\..*"
