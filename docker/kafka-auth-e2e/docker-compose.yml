services:
  postgres:
    image: postgres:14-alpine
    container_name: kafka-auth-e2e-postgres
    environment:
      POSTGRES_USER: groups
      POSTGRES_PASSWORD: groups
      POSTGRES_DB: groups
    ports:
      - "5434:5432"
    networks:
      - kafka-auth-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groups -d groups"]
      interval: 2s
      timeout: 2s
      retries: 20

  hydra:
    image: oryd/hydra:v25.4.0
    container_name: kafka-auth-e2e-hydra
    environment:
      DSN: memory
      STRATEGIES_ACCESS_TOKEN: jwt
      URLS_SELF_ISSUER: http://hydra:4444/
      SECRETS_SYSTEM: youReallyNeedToChangeThisSecretKey32CharsLong!
    ports:
      - "4444:4444"
      - "4445:4445"
    command: serve all --dev
    networks:
      - kafka-auth-net

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka-auth-e2e-broker
    depends_on:
      - hydra
    networks:
      - kafka-auth-net
    ports:
      - "9092:9092"
      - "9096:9096"
    volumes:
      - ./certs:/mnt/certs:ro
      - ./server.properties:/etc/kafka/server.properties:ro
    command: >
      sh -c "
        CLUSTER_ID=$$(/opt/kafka/bin/kafka-storage.sh random-uuid) &&
        /opt/kafka/bin/kafka-storage.sh format -t $$CLUSTER_ID -c /etc/kafka/server.properties &&
        exec /opt/kafka/bin/kafka-server-start.sh /etc/kafka/server.properties
      "

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-auth-e2e-ui
    profiles:
      - ui
    network_mode: host
    environment:
      SERVER_PORT: 8088
      DYNAMIC_CONFIG_ENABLED: "true"
      DYNAMIC_CONFIG_PATH: /etc/kafkaui/config.yml
    volumes:
      - ./config.yml:/etc/kafkaui/config.yml:ro
      - ./protos:/etc/protos:ro

networks:
  kafka-auth-net:
    name: kafka-auth-net
