name: ci
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release-**"
    tags:
      - "v**"
  pull_request:
    branches:
      - "*"

jobs:
  openspec-check:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/openspec-check.yaml
  unit-test:
    uses: ./.github/workflows/unittest.yaml
  build:
    needs: [ unit-test ]
    uses: ./.github/workflows/build-and-test-rock.yaml
  gh-publish-branch:
    permissions:
      packages: write
      contents: read
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [ build, unit-test ]
    uses: canonical/identity-team/.github/workflows/_rock-gh-publish.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0
    with:
      rock: ${{ needs.build.outputs.rock }}

  gh-publish-candidate:
    permissions:
      packages: write
      contents: read
    if: ${{ github.ref_type == 'tag' }}
    needs: [ build, unit-test ]
    uses: canonical/identity-team/.github/workflows/_rock-gh-publish.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0
    with:
      rock: ${{ needs.build.outputs.rock }}
      candidate: true

  scan:
    permissions:
      packages: read
      contents: read
      security-events: write
      actions: read
    if: ${{ !cancelled() && (needs.gh-publish-branch.result == 'success' || needs.gh-publish-candidate.result == 'success') }}
    needs: [ gh-publish-branch, gh-publish-candidate ]
    uses: canonical/identity-team/.github/workflows/_rock-scan.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0
    with:
      image: ${{ needs.gh-publish-candidate.outputs.image || needs.gh-publish-branch.outputs.image }}
      exit-code: '1'
      severity: 'HIGH,CRITICAL'
      ignore-unfixed: true
      trivyignores: '.trivyignore'

  promote:
    permissions:
      packages: write
      contents: write
    if: ${{ github.ref_type == 'tag' }}
    needs: [ gh-publish-candidate, scan ]
    uses: canonical/identity-team/.github/workflows/_rock-promote.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0
    with:
      candidate-image: ${{ needs.gh-publish-candidate.outputs.image }}
      release-tag: ${{ github.ref_name }}
      promote-stable: true
