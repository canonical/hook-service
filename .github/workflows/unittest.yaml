name: unit test
run-name: Unit test steps for ${{ github.sha }} on ${{ github.ref_name }}

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: Install Podman
        uses: redhat-actions/podman-install@6daab8b71872b8595fa4e0d3126da360afea3c3c # main

      - name: Setup podman for rootless (standard GitHub runner user)
        run: systemctl --user enable --now podman.socket

      - name: Build Go code
        run: make test
        env:
          GO_TEST_PARALLEL: 10
          DOCKER_HOST: "unix://$XDG_RUNTIME_DIR/podman/podman.sock"

      - uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7
        with:
          files: ./coverage.out

      - name: Upload Go test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Go-results
          path: test.json
